name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper (fixes corrupt wrapper jar)
      run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate debug keystore
      run: |
        keytool -genkey -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Ensure google-services.json exists
      run: |
        if [ ! -f app/google-services.json ]; then
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          else
            echo '{"project_info":{"project_number":"1039813595123","project_id":"quranreader-67b33","storage_bucket":"quranreader-67b33.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1039813595123:android:827244eaf363d1ae0f4c86","android_client_info":{"package_name":"com.quranreader.mlibrary"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyMockKeyForBuild1234567890"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Build Release AAB (App Bundle for Play Store)
      run: ./gradlew bundleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab

    - name: Upload Debug APK to Appetize.io
      run: |
        curl --request POST \
          --url https://api.appetize.io/v1/apps \
          -u "${{ secrets.APPETIZE_TOKEN }}:" \
          -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
          -F "platform=android"
